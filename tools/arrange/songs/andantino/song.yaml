# Andantino in G: an original sample in a classical style, A (G major) - B (E minor) - A' (G major) in 3/4.
# A: the flute's tune over a pizzicato waltz accompaniment, half cadence at bar 4, full cadence at bar 8.
# B: the cellos sing a new tune in E minor over tremolo violins and harp arpeggios; Am7 - D7sus4 - D7 turns back
# to G and the flute's pickup leads into A'. A': the tune again, violins an octave below, clarinet in thirds,
# a deceptive cadence (D7 - Em) at bar 8 and the climax on C6 before the close.
title: Andantino in G
tempo: 84
meter: 3/4
steps_per_beat: 4
key: G major
parts:
  flute:      {name: Flute, program: 73, sound: ssod/flute, role: melody}
  oboe:       {name: Oboe, program: 68, sound: vsco2/oboe}
  clarinet:   {name: Clarinet, program: 71, sound: vsco2/clarinet}
  bassoon:    {name: Bassoon, program: 70, sound: vsco2/bassoon}
  horn:       {name: Horn, program: 60, sound: vsco2/horn}
  trumpet:    {name: Trumpet, program: 56, sound: vsco2/trumpet}
  trombone:   {name: Trombone, program: 57, sound: vsco2/trombone}
  tuba:       {name: Tuba, program: 58, sound: vsco2/tuba}
  timpani:    {name: Timpani, program: 47, sound: vsco2/timpani}
  glock:      {name: Glockenspiel, program: 9, sound: vsco2/glockenspiel}
  harp:       {name: Harp, program: 46, sound: vsco2/harp}
  violins:    {name: Violins, program: 48, sound: vsco2/violins}
  violas:     {name: Violas, program: 48, sound: vsco2/violas}
  cellos:     {name: Cellos, program: 48, sound: vsco2/cellos}
  contrabass: {name: Contrabass, program: 43, sound: vsco2/contrabass, role: bass}
voice_leading: [flute, contrabass]
form:
  - a: 8
  - b: 8
  - a2: 10
# mix gains: set from each stem's level while playing, so that the tune leads (the SSO flute renders
# ~14 dB quieter than the VSCO sounds)
mix:
  flute:      {gain: 14, pan: 0.1}
  oboe:       {gain: 0, pan: 0.05}
  clarinet:   {gain: -7, pan: 0.25}
  bassoon:    {gain: -5, pan: 0.3}
  horn:       {gain: -4, pan: -0.3}
  trumpet:    {gain: -11, pan: -0.15}
  trombone:   {gain: 3, pan: 0.2}
  tuba:       {gain: 1, pan: 0.35}
  timpani:    {gain: 1, pan: -0.1}
  glock:      {gain: 10, pan: -0.25}
  harp:       {gain: 3, pan: -0.2}
  violins:    {gain: 1, pan: -0.4}
  violas:     {gain: -5, pan: 0.15}
  cellos:     {gain: -2, pan: 0.35}
  contrabass: {gain: 2, pan: 0.45}
