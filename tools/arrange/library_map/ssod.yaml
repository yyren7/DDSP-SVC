# Spitfire Symphony Orchestra: Discover (Kontakt Player library, free), played by Kontakt 8 Player 8.14.1 (VST3).
# Installed with the Spitfire Audio app to root:, registered in Native Access with the serial from the Spitfire
# account. Each sound's state is captured by hand (render.py --capture ssod/<sound>: load the patch from Kontakt's
# menu (Load), wait until it says it sounds, close the window). A patch loaded while no audio runs stays
# "INSTRUMENT NOT INITIALISED" and its saved state (a few KB instead of ~300 KB) renders silence.
# A fresh instance takes ~35 s to load. Licence: rendered audio must not be used to train any model.
# First pass: one sound, default articulation only; ranges and keyswitches are still to be read from the patches.
library: Spitfire Symphony Orchestra Discover
root: D:/audio_libs/Spitfire/Spitfire Symphony Orchestra - Discover
plugin: C:/Program Files/Common Files/VST3/Kontakt 8.vst3
sounds:
  flute:
    patch: Instruments/Symphonic Woodwinds/Flute Solo - All techniques.nki
    state: states/ssod_flute.bin
    range: [C4, C7]
    default: sus
    articulations:
      sus: {}
