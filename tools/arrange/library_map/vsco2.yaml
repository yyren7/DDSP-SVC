# VSCO 2 Community Edition 1.1.0, SFZ version (CC0): https://github.com/sgossner/VSCO-2-CE (tag 1.1.0)
# played by sfizz 1.2.3 (VST3). Ranges are where the patches have samples; keyswitches are the patches' sw_ keys
# (SFZ note names, C4 = MIDI 60). Dynamics are velocity layers only (no CC1 crossfade).
# root: is a sparse git checkout (--filter=blob:none) of the sample folders the sounds below use; a sound whose
# folder is missing renders silence (sfizz logs "Removing the region"): git sparse-checkout add <folder>.
# Claude-*-KS.sfz are written into root: by vsco2_ks.py, which joins the one-articulation files with keyswitches.
library: VSCO 2 CE 1.1.0
root: D:/audio_libs/VSCO-2-CE
# Pedalboard cannot scan the sfizz.vst3 bundle folder; the DLL inside it loads, and holds two plugins.
plugin: C:/Program Files/Common Files/VST3/sfizz.vst3/Contents/x86_64-win/sfizz.vst3
plugin_name: sfizz
state_from: sfz  # render.py makes the state from root/patch: nothing to capture
sounds:
  flute:
    patch: Flute-KS.sfz
    range: [C4, C7]
    default: vib
    articulations:
      sus: {keyswitch: C2}
      vib: {keyswitch: C#2}
      exp: {keyswitch: D2}
      stac: {keyswitch: D#2}
  clarinet:
    patch: Clarinet-KS.sfz
    range: [D3, F#6]
    default: sus
    articulations:
      sus: {keyswitch: C2}
