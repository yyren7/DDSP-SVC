# VSCO 2 Community Edition 1.1.0, SFZ version (CC0): https://github.com/sgossner/VSCO-2-CE (tag 1.1.0)
# played by sfizz 1.2.3 (VST3). Ranges are where the patches have samples; keyswitches are the patches' sw_ keys
# (SFZ note names, C4 = MIDI 60). Dynamics are velocity layers only (no CC1 crossfade).
library: VSCO 2 CE 1.1.0
root: D:/audio_libs/VSCO-2-CE
plugin: C:/Program Files/Common Files/VST3/sfizz.vst3
