    state: states/vsco2_flute.bin
    range: [C4, C7]
    default: vib
    articulations:
      sus: {keyswitch: C2}
      vib: {keyswitch: C#2}
      exp: {keyswitch: D2}
      stac: {keyswitch: D#2}
  clarinet:
